name: Daily GitHub Activity & Insights Sync

on:
  schedule:
    # Run everyday at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Activity & Update README
        run: python scripts/update-activity.py

      - name: Commit & Push Changes
        run: |
          git config user.name "Rahul Motvani"
          git config user.email "271194390+rahulmotvani0-sketch@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(activity): sync live GitHub activity & insights [skip ci]"
            git push origin main
          else
            echo "No activity changes detected."
          fi
